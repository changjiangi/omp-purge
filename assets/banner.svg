<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" fill="none" role="img" aria-label="omp-purge — session-scoped system prompt control">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#05070d"/>
      <stop offset="0.55" stop-color="#0a1020"/>
      <stop offset="1" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent" x1="70" y1="80" x2="700" y2="190" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="0.52" stop-color="#a371f7"/>
      <stop offset="1" stop-color="#f778ba"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(980 20) rotate(90) scale(230 230)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1f6feb" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#1f6feb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(80 260) rotate(-90) scale(220 220)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#a371f7" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#a371f7" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#1f6feb" stroke-opacity="0.10" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#grid)"/>
  <rect width="1200" height="260" fill="url(#glowA)"/>
  <rect width="1200" height="260" fill="url(#glowB)"/>

  <rect x="28" y="22" width="1144" height="216" rx="16" fill="#0d1117" fill-opacity="0.60" stroke="#30363d"/>
  <path d="M28 54H1172" stroke="#30363d"/>
  <circle cx="52" cy="38" r="4.5" fill="#ff5f56"/>
  <circle cx="68" cy="38" r="4.5" fill="#ffbd2e"/>
  <circle cx="84" cy="38" r="4.5" fill="#27c93f"/>
  <text x="106" y="43" fill="#8b949e" font-family="'SFMono-Regular','JetBrains Mono',Menlo,monospace" font-size="12">~/plugins/omp-purge</text>
  <text x="1148" y="43" text-anchor="end" fill="#6e7681" font-family="'SFMono-Regular','JetBrains Mono',Menlo,monospace" font-size="11">v1.1.1 · MIT</text>

  <g font-family="'SFMono-Regular','JetBrains Mono',Menlo,monospace">
    <text x="64" y="122" fill="#f0f6fc" font-size="52" font-weight="700" letter-spacing="1.5">OMP<tspan fill="url(#accent)">-PURGE</tspan></text>
    <text x="66" y="154" fill="#8b949e" font-size="13" letter-spacing="3.4">OMP JAILBREAK / SYSTEM PROMPT CONTROL</text>
    <text x="66" y="202" fill="#6e7681" font-size="11" letter-spacing="1.6">NO REFUSALS / ANYTHING GOES / MOST MAINSTREAM MODELS</text>
  </g>

  <g transform="translate(920 82)">
    <rect width="224" height="120" rx="12" fill="#05070d" stroke="#1f6feb" stroke-opacity="0.45"/>
    <circle cx="16" cy="18" r="3" fill="#3fb950"/>
    <text x="28" y="22" fill="#6e7681" font-family="'SFMono-Regular','JetBrains Mono',Menlo,monospace" font-size="10">session</text>
    <text x="18" y="52" fill="#58a6ff" font-family="'SFMono-Regular','JetBrains Mono',Menlo,monospace" font-size="13">&gt; /purge on</text>
    <text x="18" y="76" fill="#8b949e" font-family="'SFMono-Regular','JetBrains Mono',Menlo,monospace" font-size="11">mode: strict</text>
    <text x="18" y="96" fill="#3fb950" font-family="'SFMono-Regular','JetBrains Mono',Menlo,monospace" font-size="11">● persona active</text>
  </g>
</svg>
